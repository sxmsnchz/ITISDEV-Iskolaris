<div class="budget-layout">
  <!-- Form and Inputs -->
  <div class="card">
    <div class="card-header">
      <h3>Add Ledger Entry</h3>
    </div>
    <div class="card-body">
      <form id="ledger-form">
        <div class="form-group">
          <label>Transaction Type</label>
          <div class="radio-toggle">
            <label class="radio-label">
              <input type="radio" name="ledger-type" value="expense" checked>
              <span>Expense</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="ledger-type" value="income">
              <span>Income</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="ledger-category">Category</label>
          <select id="ledger-category" required>
            <!-- Expense categories -->
            <option value="food">Food & Dining</option>
            <option value="transportation">Transportation</option>
            <option value="dorm rent">Dorm Rent / Boarding</option>
            <option value="school supplies">School Supplies & Books</option>
            <option value="other">Other Expenses</option>
          </select>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="ledger-amount">Amount (₱)</label>
            <input type="number" step="0.01" id="ledger-amount" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="ledger-date">Date</label>
            <input type="date" id="ledger-date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="ledger-desc">Description</label>
          <input type="text" id="ledger-desc" placeholder="e.g. Lunch at La Salle Hall" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Add Transaction</button>
      </form>
    </div>
  </div>

  <!-- Visual Expense Charts -->
  <div class="card">
    <div class="card-header">
      <h3>Ledger Visual Analytics</h3>
    </div>
    <div class="card-body">
      <div class="chart-container-small">
        <canvas id="expensePieChart"></canvas>
      </div>
      <div class="runway-alert margin-top text-center" id="budget-runway-box">
        <h4 class="runway-title">Estimated Wallet Runway</h4>
        <div class="runway-days" id="runway-days-value">0 Days</div>
        <p class="runway-desc" id="runway-desc-value">Add your stipend & expenses to compute financial safety windows.</p>
      </div>
    </div>
  </div>

  <!-- Transaction List -->
  <div class="card full-width">
    <div class="card-header">
      <h3>Transaction History Ledger</h3>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Category</th>
              <th>Description</th>
              <th class="text-right">Amount</th>
            </tr>
          </thead>
          <tbody id="ledger-table-body">
            <!-- Dynamic transactions -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
