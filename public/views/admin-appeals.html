<div class="card">
  <div class="card-header">
    <h3>Reconsideration Appeals Panel</h3>
  </div>
  <div class="card-body">
    <p class="card-desc">Inspect Letter of Reconsideration submissions from scholars placed on probationary status.</p>

    <div class="table-responsive margin-top">
      <table class="table">
        <thead>
          <tr>
            <th style="text-align: center;">Student</th>
            <th style="text-align: center;">Scholarship</th>
            <th style="text-align: center;">Appeal History</th>
            <th style="text-align: center;">Appeal Context</th>
            <th style="text-align: center;">Documents</th>
            <th style="text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="admin-appeals-table">
          <!-- Dynamic appeals -->
        </tbody>
      </table>
    </div>
    <p id="no-appeals-msg" class="no-records hidden">No pending appeals submitted.</p>
  </div>
</div>
