<div class="card">
  <div class="card-header">
    <h3>Stipend Disbursements & Allowances Tracker</h3>
  </div>
  <div class="card-body">
    <p class="card-desc">Disburse monthly stipends or term grants. Clicking "Disburse" triggers notification emails and automatically syncs funds into the scholar's budget ledger.</p>

    <div class="table-responsive margin-top">
      <table class="table">
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Scholarship</th>
            <th>Renewal Status</th>
            <th>Timeline Cycles (Disbursement Actions)</th>
          </tr>
        </thead>
        <tbody id="admin-stipend-table">
          <!-- Dynamic stipend status grid -->
        </tbody>
      </table>
    </div>
  </div>
</div>
